name: Build Note8 Kernel with Docker support

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout this repo (config + workflow)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            binutils-aarch64-linux-gnu \
            gcc-9-aarch64-linux-gnu \
            python3 make git libncurses-dev zip
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/local/bin/aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version

      - name: Clone kernel source (8890q lineage-19.1 = kernel 4.4.302, LineageOS 20)
        run: |
          git clone --depth=1 \
            --branch lineage-19.1 \
            https://github.com/8890q/android_kernel_samsung_universal8895 \
            kernel

      - name: Apply source patches
        run: |
          cd kernel
          python3 ../patches/apply_patches.py

      - name: Apply kernel config
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- exynos8895-greatlte_defconfig
          cat ../docker.fragment >> .config
          printf 'CONFIG_RKP=n\nCONFIG_RKP_KDP=n\nCONFIG_RKP_NS_PROT=n\n' >> .config
          printf 'CONFIG_RKP_DMAP_PROT=n\nCONFIG_RKP_6G=n\nCONFIG_RKP_CFP=n\n' >> .config
          printf 'CONFIG_RKP_CFP_JOPP=n\nCONFIG_TIMA=n\nCONFIG_TIMA_LOG=n\n' >> .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Verify Docker options
        run: |
          grep -E "CONFIG_BRIDGE|CONFIG_OVERLAY_FS|CONFIG_VETH|CONFIG_NET_NS|POSIX_MQUEUE|ADDRTYPE" kernel/.config

      - name: Build kernel (GCC)
        run: |
          set -o pipefail
          cd kernel
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb 2>&1 | tee /tmp/kernel_build.log | tail -100

      - name: Check output
        if: always()
        run: |
          echo "=== arch/arm64/boot ==="
          ls -lh kernel/arch/arm64/boot/ 2>/dev/null || echo "(not built)"
          echo "=== Last 30 lines ==="
          tail -30 /tmp/kernel_build.log 2>/dev/null || echo "(no log)"
          echo "=== Errors ==="
          grep -E "Error [0-9]|undefined reference|error:" /tmp/kernel_build.log 2>/dev/null | grep -v "warning:" | tail -20 || echo "none"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=/device.name1=greatlte/' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/platform/11120000.ufs/by-name/BOOT;|' AnyKernel3/anykernel.sh
          if [ -f kernel/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/arch/arm64/boot/Image.gz ]; then
            cp kernel/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../note8-kernel-docker.zip * -x '*.git*' README.md

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: note8-kernel-docker
          path: note8-kernel-docker.zip
          retention-days: 30

      - name: Upload raw Image
        uses: actions/upload-artifact@v4
        with:
          name: note8-kernel-image
          path: |
            kernel/arch/arm64/boot/Image.gz-dtb
            kernel/arch/arm64/boot/Image.gz
          retention-days: 30
          if-no-files-found: warn
