name: Build Note8 Kernel with Docker support

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout this repo (config + workflow)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            python3 make git libncurses-dev

      - name: Install Android clang 12 (same as original kernel)
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          # Android clang r416183b (version 12.0.5) - same as used by ivanmeler
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz \
            -O clang.tar.gz 2>/dev/null || \
          wget -q https://github.com/kdrag0n/proton-clang/releases/download/20210522/proton-clang-20210522.tar.gz \
            -O clang.tar.gz
          mkdir clang && tar -xf clang.tar.gz -C clang --strip-components=0 2>/dev/null || true
          # Fallback: use LLVM from apt
          if [ ! -f "$HOME/toolchains/clang/bin/clang" ]; then
            sudo apt-get install -y clang-14 lld-14
            mkdir -p $HOME/toolchains/clang/bin
            ln -sf /usr/bin/clang-14 $HOME/toolchains/clang/bin/clang
            ln -sf /usr/bin/clang++-14 $HOME/toolchains/clang/bin/clang++
            ln -sf /usr/bin/ld.lld-14 $HOME/toolchains/clang/bin/ld.lld
            for t in /usr/bin/llvm-*-14; do
              base=$(basename ${t%-14})
              ln -sf "$t" $HOME/toolchains/clang/bin/"$base"
            done
          fi
          echo "$HOME/toolchains/clang/bin" >> $GITHUB_PATH

      - name: Clone kernel source (ivanmeler seals-pie-new)
        run: |
          git clone --depth=1 \
            --branch seals-pie-new \
            https://github.com/ivanmeler/android_kernel_samsung_universal8895 \
            kernel
          echo "Kernel source cloned"

      - name: Apply kernel config from device
        run: |
          cp kernel.config kernel/.config
          # Add Docker-required options + disable Samsung proprietary blobs (RKP/TIMA Knox hypervisor)
          # Knox is already burned on this device (Magisk installed), safe to disable
          cat docker.fragment >> kernel/.config
          cat >> kernel/.config << 'EOF'
          # Disable RKP (Samsung Knox hypervisor) - requires vmm.6g.elf blob not in public repo
          CONFIG_RKP=n
          CONFIG_RKP_KDP=n
          CONFIG_RKP_NS_PROT=n
          CONFIG_RKP_DMAP_PROT=n
          CONFIG_RKP_6G=n
          CONFIG_RKP_CFP=n
          CONFIG_RKP_CFP_JOPP=n
          CONFIG_TIMA=n
          CONFIG_TIMA_LOG=n
          EOF
          cd kernel
          # Resolve config (accept defaults for new options)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Verify Docker options are enabled
        run: |
          cd kernel
          echo "=== Docker config check ==="
          grep -E "CONFIG_BRIDGE|CONFIG_OVERLAY_FS|CONFIG_VETH|CONFIG_NET_NS" .config
          echo "==========================="

      - name: Build kernel
        run: |
          set -o pipefail
          cd kernel
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export SUBARCH=arm64

          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error=section -Wno-error=enum-conversion -Wno-error=address-of-packed-member -Wno-error" \
            Image.gz-dtb 2>&1 | tee /tmp/kernel_build.log | tail -100

      - name: Check output
        run: |
          echo "=== arch/arm64/boot contents ==="
          ls -lh kernel/arch/arm64/boot/ || echo "(empty)"
          echo "=== Last 30 build lines ==="
          tail -30 /tmp/kernel_build.log || true
          echo "=== Build errors ==="
          grep -i "error:\|Error\b" /tmp/kernel_build.log | tail -20 || echo "none"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          # Configure for greatlte (Note 8)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=/device.name1=greatlte/' AnyKernel3/anykernel.sh
          # Copy kernel image
          if [ -f kernel/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/arch/arm64/boot/Image.gz ]; then
            cp kernel/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../note8-kernel-docker.zip * -x '*.git*' README.md

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: note8-kernel-docker
          path: note8-kernel-docker.zip
          retention-days: 30

      - name: Upload raw Image
        uses: actions/upload-artifact@v4
        with:
          name: note8-kernel-image
          path: |
            kernel/arch/arm64/boot/Image.gz-dtb
            kernel/arch/arm64/boot/Image.gz
          retention-days: 30
