name: Build Note8 Kernel with Docker support

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout this repo (config + workflow)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            python3 make git libncurses-dev

      - name: Install clang-12 (same major version as original kernel build)
        run: |
          sudo apt-get install -y clang-12 lld-12 llvm-12
          # Create symlinks without version suffix
          sudo ln -sf /usr/bin/clang-12 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-12 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-12 /usr/local/bin/ld.lld
          for t in /usr/bin/llvm-*-12; do
            base=$(basename ${t%-12})
            sudo ln -sf "$t" /usr/local/bin/"$base"
          done
          clang --version

      - name: Clone kernel source (ivanmeler seals-pie-new)
        run: |
          git clone --depth=1 \
            --branch seals-pie-new \
            https://github.com/ivanmeler/android_kernel_samsung_universal8895 \
            kernel
          echo "Kernel source cloned"

      - name: Apply kernel config from device
        run: |
          cp kernel.config kernel/.config
          # Add Docker-required options + disable Samsung proprietary blobs (RKP/TIMA Knox hypervisor)
          # Knox is already burned on this device (Magisk installed), safe to disable
          cat docker.fragment >> kernel/.config
          cat >> kernel/.config << 'EOF'
          # Disable RKP (Samsung Knox hypervisor) - requires vmm.6g.elf blob not in public repo
          CONFIG_RKP=n
          CONFIG_RKP_KDP=n
          CONFIG_RKP_NS_PROT=n
          CONFIG_RKP_DMAP_PROT=n
          CONFIG_RKP_6G=n
          CONFIG_RKP_CFP=n
          CONFIG_RKP_CFP_JOPP=n
          CONFIG_TIMA=n
          CONFIG_TIMA_LOG=n
          EOF
          cd kernel
          # Resolve config (accept defaults for new options)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Verify Docker options are enabled
        run: |
          cd kernel
          echo "=== Docker config check ==="
          grep -E "CONFIG_BRIDGE|CONFIG_OVERLAY_FS|CONFIG_VETH|CONFIG_NET_NS" .config
          echo "==========================="

      - name: Build kernel
        run: |
          set -o pipefail
          cd kernel
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export SUBARCH=arm64

          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CC=clang \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb 2>&1 | tee /tmp/kernel_build.log | tail -100

      - name: Check output
        if: always()
        run: |
          echo "=== arch/arm64/boot contents ==="
          ls -lh kernel/arch/arm64/boot/ 2>/dev/null || echo "(empty or not built)"
          echo "=== Last 50 build lines ==="
          tail -50 /tmp/kernel_build.log 2>/dev/null || echo "(no log)"
          echo "=== Build errors ==="
          grep -E "^[^Z]+error:|make.*Error" /tmp/kernel_build.log 2>/dev/null | grep -v "warning:" | tail -30 || echo "none"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          # Configure for greatlte (Note 8)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=/device.name1=greatlte/' AnyKernel3/anykernel.sh
          # Copy kernel image
          if [ -f kernel/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/arch/arm64/boot/Image.gz ]; then
            cp kernel/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../note8-kernel-docker.zip * -x '*.git*' README.md

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: note8-kernel-docker
          path: note8-kernel-docker.zip
          retention-days: 30

      - name: Upload raw Image
        uses: actions/upload-artifact@v4
        with:
          name: note8-kernel-image
          path: |
            kernel/arch/arm64/boot/Image.gz-dtb
            kernel/arch/arm64/boot/Image.gz
          retention-days: 30
